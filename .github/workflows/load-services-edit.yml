name: Load services editor
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add services editor script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="js/servicos-edicao.js"></script>'
          if tag not in s:
              s=s.replace('<script src="app.js"></script>', '<script src="app.js"></script>'+tag)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Carregar edição de Todos os Serviços'
          git push
