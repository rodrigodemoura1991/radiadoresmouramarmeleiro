name: E2E - Radiadores Moura

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependências
        run: npm install
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Testes E2E
        run: npm run test:e2e
        env:
          BASE_URL: https://rodrigodemoura1991.github.io/radiadoresmouramarmeleiro/
      - name: Guardar relatório em falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
