name: Ajustar layout dos servicos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  ajustar-e-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Corrigir campos do lancamento
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Garante a descricao principal no formulario superior.
          if 'id="ds"' not in s:
              s = s.replace(
                  '<div class="field wide">Cliente<input id="cl" list="lscl" autocomplete="off"></div>',
                  '<div class="field wide">Cliente<input id="cl" list="lscl" autocomplete="off"></div>\n<div class="field wide">Descrição do serviço<input id="ds" autocomplete="off"></div>'
              )

          # Marca e modelo fica SOMENTE na parte superior do lançamento.
          if 'id="mm"' not in s:
              s = s.replace(
                  '<div class="field wide">Descrição do serviço<input id="ds" autocomplete="off"></div>',
                  '<div class="field wide">Descrição do serviço<input id="ds" autocomplete="off"></div>\n<div class="field">Marca e modelo<input id="mm" autocomplete="off"></div>'
              )

          # Remove Marca/modelo dos itens de serviços/produtos.
          s = re.sub(r'<input[^>]*(?:placeholder="Marca/modelo"|class="[^"]*imodel[^"]*")[^>]*>', '', s)

          # Salva Marca/modelo no lançamento principal.
          if 'marcaModelo:mm.value' not in s:
              s = s.replace(
                  'cliente:cl.value,descricao:desc,obs:ob.value,status:st.value,',
                  'cliente:cl.value,descricao:desc,marcaModelo:mm.value,obs:ob.value,status:st.value,'
              )

          # Carrega Marca/modelo ao editar.
          if 'mm.value=x.marcaModelo' not in s:
              s = s.replace(
                  "cl.value=x.cliente;ds.value=x.descricao||'';ob.value=x.obs||'';st.value=x.status||'';",
                  "cl.value=x.cliente;ds.value=x.descricao||'';mm.value=x.marcaModelo||'';ob.value=x.obs||'';st.value=x.status||'';"
              )

          # Compatibilidade com registros antigos.
          s = s.replace(
              "{d:x.descricao,m:x.marcaModelo,v:x.venda||0,c:x.custo||0,sit:'A fazer'}",
              "{d:x.descricao,v:x.venda||0,c:x.custo||0,sit:'A fazer'}"
          )

          p.write_text(s, encoding='utf-8')

      - name: Salvar alteracao no repositorio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Move marca e modelo para o topo do lancamento"
            git push
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
