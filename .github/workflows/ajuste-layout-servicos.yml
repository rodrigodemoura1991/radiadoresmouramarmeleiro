name: Ajustar layout dos servicos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  ajustar-e-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Corrigir campos do lancamento
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove Marca e modelo do formulario principal.
          s = re.sub(r'<div class="field">Marca e modelo<input id="mm"[^>]*></div>', '', s)

          # Remove Marca/modelo dos itens de servicos/produtos.
          s = re.sub(r'<input[^>]*(?:placeholder="Marca/modelo"|class="[^"]*imodel[^"]*")[^>]*>', '', s)

          # Restaura a descricao do servico logo depois do Cliente.
          if 'id="ds"' not in s:
              s = s.replace(
                  '<div class="field wide">Cliente<input id="cl" list="lscl" autocomplete="off"></div>',
                  '<div class="field wide">Cliente<input id="cl" list="lscl" autocomplete="off"></div>\n<div class="field wide">Descrição do serviço<input id="ds" autocomplete="off"></div>'
              )

          # Salva a descricao principal separadamente, sem apagar os itens.
          s = s.replace("desc=its.map(x=>x.d).filter(Boolean).join(', '),o={", "desc=ds.value||its.map(x=>x.d).filter(Boolean).join(', '),o={")

          # Carrega a descricao principal ao editar.
          s = s.replace("cl.value=x.cliente;ob.value=x.obs||'';st.value=x.status||'';", "cl.value=x.cliente;ds.value=x.descricao||'';ob.value=x.obs||'';st.value=x.status||'';")

          p.write_text(s, encoding='utf-8')

      - name: Salvar alteracao no repositorio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Restaura descricao e remove marca modelo"
            git push
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
