<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestão de Serviços e Vendas</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}header{background:#111827;color:#fff;padding:18px 16px}header h1{margin:0;font-size:21px}.wrap{max-width:1100px;margin:auto;padding:15px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 4px #0001}.label{font-size:12px;color:#6b7280}.big{font-size:20px;font-weight:700;margin-top:5px}.green{color:#047857}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;font-weight:700}.field input,.field select{border:1px solid #d1d5db;border-radius:9px;padding:10px;font-size:15px;background:#fff}.wide{grid-column:span 2}.actions{display:flex;gap:8px;margin-top:4px}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:#111827;color:#fff}.secondary{background:#e5e7eb}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.toolbar input,.toolbar select{padding:9px;border:1px solid #d1d5db;border-radius:9px;background:#fff}.table{background:#fff;border-radius:14px;overflow:auto;box-shadow:0 1px 4px #0001}table{border-collapse:collapse;width:100%;min-width:1050px}th,td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:13px;white-space:nowrap}th{background:#f9fafb;font-size:12px;color:#4b5563}td.num{text-align:right}.empty{text-align:center;padding:28px;color:#6b7280}.status{font-weight:700}.pix{color:#0891b2}.cartao{color:#2563eb}.boleto{color:#7c3aed}.dinheiro{color:#d97706}.pago{color:#047857}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:repeat(2,1fr)}.wide{grid-column:span 2}}@media(max-width:500px){.form{grid-template-columns:1fr}.wide{grid-column:span 1}}
</style></head><body><header><div class="wrap" style="padding:0"><h1>Gestão de Serviços e Vendas</h1></div></header><main class="wrap">
<div class="cards"><div class="card"><div class="label">Vendas</div><div id="tv" class="big">R$ 0,00</div></div><div class="card"><div class="label">Custos</div><div id="tc" class="big">R$ 0,00</div></div><div class="card"><div class="label">Impostos</div><div id="ti" class="big">R$ 0,00</div></div><div class="card"><div class="label">Lucro líquido</div><div id="tl" class="big green">R$ 0,00</div></div></div>
<section class="card"><h3 id="title" style="margin-top:0">Novo lançamento</h3><form id="form"><input type="hidden" id="id"><div class="field"><label>Data de entrada</label><input id="entrada" type="date" required></div><div class="field"><label>Data de saída</label><input id="saida" type="date"></div><div class="field wide"><label>Nome do cliente</label><input id="cliente"></div><div class="field wide"><label>Obs / Placa</label><input id="obs" placeholder="Ex.: ABC1D23 / serviço"></div><div class="field"><label>Status</label><select id="status"><option>Pago</option><option>Cartão</option><option>Boleto</option><option>Pix</option><option>Dinheiro</option></select></div><div class="field"><label>Valor de venda</label><input id="venda" type="number" min="0" step="0.01" required></div><div class="field"><label>Valor de custo</label><input id="custo" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Alíquota de imposto (%)</label><input id="aliquota" type="number" min="0" max="100" step="0.01" value="0"></div><div class="field"><label>Imposto</label><input id="imp" readonly></div><div class="field"><label>Lucro líquido</label><input id="lucro" readonly></div><div class="actions wide"><button class="btn primary">Salvar lançamento</button><button type="button" id="cancel" class="btn secondary" style="display:none">Cancelar</button></div></form></section>
<div class="toolbar"><input id="busca" placeholder="Buscar cliente ou placa"><select id="filtro"><option value="">Todos os pagamentos</option><option>Pago</option><option>Cartão</option><option>Boleto</option><option>Pix</option><option>Dinheiro</option></select><button id="csv" class="btn secondary">Exportar CSV</button><button id="backup" class="btn secondary">Backup</button><label class="btn secondary">Restaurar<input id="restore" type="file" accept=".json" hidden></label></div>
<div class="table"><table><thead><tr><th>Entrada</th><th>Saída</th><th>Cliente</th><th>Obs / Placa</th><th>Status</th><th>Venda</th><th>Custo</th><th>Imposto</th><th>Lucro</th><th></th></tr></thead><tbody id="tbody"></tbody></table><div id="empty" class="empty">Nenhum lançamento ainda.</div></div></main>
<script>
const K='gestao_servicos_vendas_v1';let dados=JSON.parse(localStorage.getItem(K)||'[]');const $=x=>document.getElementById(x);const br=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(+n||0);const hoje=()=>new Date().toISOString().slice(0,10);$('entrada').value=hoje();
function calc(){let v=+$('venda').value||0,c=+$('custo').value||0,a=+$('aliquota').value||0,i=v*a/100;$('imp').value=br(i);$('lucro').value=br(v-c-i)}['venda','custo','aliquota'].forEach(x=>$(x).oninput=calc);
function persist(){localStorage.setItem(K,JSON.stringify(dados));render()}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){let q=$('busca').value.toLowerCase(),f=$('filtro').value,a=dados.filter(r=>(!f||r.status==f)&&(!q||(r.cliente+' '+r.obs).toLowerCase().includes(q)));$('tbody').innerHTML=a.map(r=>`<tr><td>${r.entrada}</td><td>${r.saida||''}</td><td>${esc(r.cliente)}</td><td>${esc(r.obs)}</td><td class="status ${r.status.toLowerCase().replace('ó','o')}">${r.status}</td><td class="num">${br(r.venda)}</td><td class="num">${br(r.custo)}</td><td class="num">${br(r.imposto)}</td><td class="num"><b>${br(r.lucro)}</b></td><td><button class="btn secondary" onclick="editar('${r.id}')">Editar</button> <button class="btn secondary" onclick="excluir('${r.id}')">Excluir</button></td></tr>`).join('');$('empty').style.display=a.length?'none':'block';let s=k=>a.reduce((t,r)=>t+(+r[k]||0),0);$('tv').textContent=br(s('venda'));$('tc').textContent=br(s('custo'));$('ti').textContent=br(s('imposto'));$('tl').textContent=br(s('lucro'))}
$('form').onsubmit=e=>{e.preventDefault();let v=+$('venda').value||0,c=+$('custo').value||0,a=+$('aliquota').value||0,i=v*a/100,o={id:$('id').value||crypto.randomUUID(),entrada:$('entrada').value,saida:$('saida').value,cliente:$('cliente').value,obs:$('obs').value,status:$('status').value,venda:v,custo:c,aliquota:a,imposto:i,lucro:v-c-i},n=dados.findIndex(x=>x.id==o.id);n>=0?dados[n]=o:dados.unshift(o);persist();reset()};
function reset(){$('form').reset();$('id').value='';$('entrada').value=hoje();$('custo').value=0;$('aliquota').value=0;$('title').textContent='Novo lançamento';$('cancel').style.display='none';calc()}$('cancel').onclick=reset;
window.editar=id=>{let r=dados.find(x=>x.id==id);if(!r)return;['entrada','saida','cliente','obs','status','venda','custo','aliquota'].forEach(k=>$(k).value=r[k]??'');$('id').value=id;$('title').textContent='Editar lançamento';$('cancel').style.display='inline-block';calc();scrollTo({top:0,behavior:'smooth'})};window.excluir=id=>{if(confirm('Excluir este lançamento?')){dados=dados.filter(x=>x.id!=id);persist()}};$('busca').oninput=render;$('filtro').onchange=render;
// Ao pressionar Enter, avança para o próximo campo editável do formulário.
$('form').addEventListener('keydown',e=>{if(e.key!=='Enter'||e.target.tagName==='BUTTON')return;const campos=[...$('form').querySelectorAll('input:not([type="hidden"]):not([readonly]), select')];const i=campos.indexOf(e.target);if(i<0)return;e.preventDefault();if(i<campos.length-1){campos[i+1].focus()}else{$('form').requestSubmit()}});
$('csv').onclick=()=>{let h=['Entrada','Saída','Cliente','Obs/Placa','Status','Venda','Custo','Alíquota','Imposto','Lucro'];let c=h.join(';')+'\n'+dados.map(r=>[r.entrada,r.saida,r.cliente,r.obs,r.status,r.venda,r.custo,r.aliquota,r.imposto,r.lucro].map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(';')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+c],{type:'text/csv;charset=utf-8'}));a.download='gestao-servicos-vendas.csv';a.click()};$('backup').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(dados,null,2)],{type:'application/json'}));a.download='backup-gestao.json';a.click()};$('restore').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{dados=JSON.parse(r.result);persist();alert('Backup restaurado.')}catch{alert('Backup inválido')}};r.readAsText(f)};calc();render();
</script></body></html>
